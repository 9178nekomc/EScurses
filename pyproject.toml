[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "escurses"
version = "2.0.0"
description = "A zero-dependency Python library for making games in the terminal"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT (see NOTICE.md for provenance)" }
authors = [
    { name = "KID194" },
    { name = "9178nekomc" },
]
keywords = ["terminal", "tui", "console", "game", "ansi", "curses", "ascii-art"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Terminals",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/KID194/EScurses"
Repository = "https://github.com/9178nekomc/EScurses"
Upstream = "https://github.com/KID194/EScurses"
Issues = "https://github.com/9178nekomc/EScurses/issues"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
escurses = "escurses.demo:main"

[tool.setuptools]
packages = ["escurses", "escurses.backends"]
include-package-data = true

[tool.setuptools.package-data]
escurses = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:escurses.*"]
